<title>ZOLF Lift</title>
<style>
/* ZOLF Lift
   Deep forest green and cream with a mint signal colour, after the reference
   direction: heavy grotesk display over monospace labels, hairline-bordered
   panels, arrow-in-box affordances. Committed single-world — every colour is
   painted explicitly so the page holds on either host ground. */

:root {
  color-scheme: dark;

  --bg: #142C26;          /* deepest forest, the page ground */
  --surface: #1D3B33;     /* panel */
  --surface-2: #26493F;   /* raised control */
  --line: #33594B;        /* hairline, green-biased so it is chosen not grey */
  --line-bright: #47705F;

  --cream: #F4F0E0;
  --text: #F4F0E0;
  --muted: #9DBAAC;
  --dim: #6E9384;

  --mint: #3ADB86;        /* the one signal colour */
  --mint-deep: #23B76A;
  --mint-soft: rgba(58, 219, 134, 0.12);

  --warn: #E8C56A;
  --bad: #E07A6A;

  --display: 'Archivo', 'Helvetica Neue', Arial, sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;

  --radius: 6px;
  --tabbar-h: 60px;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--display);
  font-size: 15px;
  line-height: 1.55;
  -webkit-text-size-adjust: 100%;
}

.app { min-height: 100dvh; display: flex; flex-direction: column; }

/* --- header --- */
.topbar {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 13px 16px;
  padding-top: max(13px, env(safe-area-inset-top));
  background: rgba(20, 44, 38, 0.95);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
}
.brand {
  font-family: var(--display);
  font-weight: 800; font-size: 15px;
  letter-spacing: -0.01em; color: var(--cream);
  text-transform: uppercase;
}
.brand span { color: var(--mint); margin-left: 6px; }
.topbar-right {
  font-family: var(--mono);
  font-size: 11px; color: var(--muted);
  display: flex; gap: 9px; align-items: center;
  text-transform: uppercase; letter-spacing: 0.04em;
}

.view {
  flex: 1; width: 100%; max-width: 720px; margin: 0 auto;
  padding: 22px 16px calc(var(--tabbar-h) + 92px);
}

/* --- type --- */
h1 {
  font-family: var(--display);
  font-size: 34px; font-weight: 800; line-height: 0.95;
  letter-spacing: -0.025em; text-transform: uppercase;
  text-wrap: balance; margin: 0 0 10px; color: var(--cream);
}
h2 {
  font-family: var(--mono);
  font-size: 11px; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.13em;
  color: var(--mint); margin: 30px 0 12px;
}
h3 { font-size: 17px; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
p { margin: 0 0 10px; }
.sub {
  font-family: var(--mono);
  color: var(--mint); font-size: 11px; line-height: 1.6;
  text-transform: uppercase; letter-spacing: 0.06em;
  margin: 0 0 20px;
}
.eyebrow {
  font-family: var(--mono);
  font-size: 10px; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.14em;
  color: var(--mint); display: block; margin-bottom: 3px;
}

/* --- panels --- */
.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 16px; margin-bottom: 10px;
}
.card.tight { padding: 12px; }
.card-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 8px; }
.card-head .meta { font-family: var(--mono); color: var(--muted); font-size: 10.5px; white-space: nowrap; text-transform: uppercase; }

.grid { display: grid; gap: 8px; }
.grid.two { grid-template-columns: 1fr 1fr; }
.grid.three { grid-template-columns: repeat(3, 1fr); }
.row { display: flex; gap: 7px; align-items: center; flex-wrap: wrap; }
.spread { display: flex; justify-content: space-between; align-items: center; gap: 10px; }

button { font: inherit; cursor: pointer; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  background: var(--surface-2); color: var(--text);
  border: 1px solid var(--line-bright); border-radius: var(--radius);
  padding: 11px 16px; min-height: 44px;
  font-family: var(--mono); font-size: 12px; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.07em;
}
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--mint); border-color: var(--mint); color: #0B2019; }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--bad); border-color: #5A3833; }
.btn.block { width: 100%; }
.btn.sm { padding: 7px 11px; min-height: 34px; font-size: 10.5px; }

.chip {
  background: transparent; border: 1px solid var(--line-bright); color: var(--text);
  border-radius: 999px; padding: 7px 13px;
  font-family: var(--mono); font-size: 11px; font-weight: 600;
  letter-spacing: 0.04em;
}
.chip.on { background: var(--mint); border-color: var(--mint); color: #0B2019; }

input, select, textarea {
  font-family: var(--mono); font-size: 14px;
  background: var(--bg); color: var(--text);
  border: 1px solid var(--line-bright); border-radius: var(--radius);
  padding: 10px 12px; width: 100%; min-height: 44px;
}
input:focus-visible, select:focus-visible, textarea:focus-visible,
button:focus-visible, .tab:focus-visible {
  outline: 2px solid var(--mint); outline-offset: 2px;
}
label {
  display: block; font-family: var(--mono);
  font-size: 10px; color: var(--muted); margin-bottom: 5px;
  font-weight: 600; text-transform: uppercase; letter-spacing: 0.1em;
}
.field { margin-bottom: 12px; }

/* --- day picker: title left, arrow-in-box right, after the reference --- */
.day-card { display: flex; align-items: center; gap: 13px; text-align: left; width: 100%; }
.day-card .n {
  width: 38px; height: 38px; flex: none; border-radius: var(--radius);
  background: var(--mint-soft); color: var(--mint);
  border: 1px solid rgba(58, 219, 134, 0.3);
  display: grid; place-items: center;
  font-family: var(--mono); font-weight: 700; font-size: 13px;
}
.day-card .body { flex: 1; min-width: 0; }
.day-card .body .t { font-family: var(--display); font-weight: 600; font-size: 17px; letter-spacing: -0.01em; }
.day-card .body .s { font-family: var(--mono); color: var(--muted); font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.04em; }
.day-card .go {
  width: 30px; height: 30px; flex: none;
  border: 1px solid var(--mint); border-radius: 3px;
  color: var(--mint); display: grid; place-items: center;
  font-size: 14px; line-height: 1;
}

/* --- exercise logging --- */
.ex {
  border: 1px solid var(--line); border-radius: var(--radius);
  background: var(--surface); margin-bottom: 8px; overflow: hidden;
}
.ex.done { border-color: var(--mint-deep); }
.ex-head {
  display: flex; align-items: center; gap: 10px;
  padding: 14px; width: 100%;
  background: none; border: 0; color: inherit; text-align: left;
}
.ex-head .t { flex: 1; min-width: 0; }
.ex-head .t .n { font-weight: 600; font-size: 17px; letter-spacing: -0.01em; }
.ex-head .t .m { font-family: var(--mono); font-size: 10.5px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
.ex-head .count { font-family: var(--mono); font-size: 11px; color: var(--muted); font-weight: 700; }
.ex.done .ex-head .count { color: var(--mint); }
.ex-body { padding: 0 14px 14px; border-top: 1px solid var(--line); }

.hint {
  background: var(--mint-soft);
  border-left: 2px solid var(--mint);
  padding: 10px 12px; margin: 12px 0;
  font-family: var(--mono); font-size: 10.5px; line-height: 1.65;
  text-transform: uppercase; letter-spacing: 0.04em; color: #C8E9D8;
}
.hint strong { color: var(--mint); }
.prev { font-family: var(--mono); font-size: 10.5px; color: var(--muted); margin: 12px 0 6px; text-transform: uppercase; letter-spacing: 0.04em; }

.setrow, .setlabels {
  display: grid; grid-template-columns: 22px 1fr 1fr 46px 42px 30px;
  gap: 6px; align-items: center;
}
.setrow { margin-bottom: 6px; }
.setrow .idx { font-family: var(--mono); color: var(--dim); font-size: 11px; text-align: center; font-weight: 700; }
.setrow input {
  padding: 8px 4px; text-align: center; min-height: 42px;
  font-variant-numeric: tabular-nums; font-weight: 700; font-size: 15px;
}
.setrow .tick {
  min-height: 42px; border-radius: var(--radius); border: 1px solid var(--line-bright);
  background: var(--bg); color: var(--dim); font-size: 16px; font-weight: 700;
}
.setrow .tick[aria-pressed="true"] { background: var(--mint); border-color: var(--mint); color: #0B2019; }
.setrow .kill {
  min-height: 42px; border-radius: var(--radius); border: 1px solid var(--line);
  background: transparent; color: var(--dim); padding: 0; font-size: 15px;
}
.setlabels {
  font-family: var(--mono); font-size: 9.5px; color: var(--dim);
  text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 7px; font-weight: 700;
}
.setlabels span { text-align: center; }

/* --- data --- */
.stat {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 13px;
}
.stat .k {
  font-family: var(--mono); font-size: 9.5px; color: var(--muted);
  text-transform: uppercase; letter-spacing: 0.11em; font-weight: 700;
}
.stat .v {
  font-family: var(--display); font-size: 26px; font-weight: 800;
  margin-top: 2px; letter-spacing: -0.02em;
  font-variant-numeric: tabular-nums; color: var(--cream);
}
.stat .u { font-family: var(--mono); font-size: 10.5px; color: var(--muted); font-weight: 600; }

.pill {
  font-family: var(--mono); font-size: 9.5px; padding: 4px 9px;
  border-radius: 3px; font-weight: 700; letter-spacing: 0.08em;
}
.pill.ok { background: var(--mint-soft); color: var(--mint); }
.pill.low { background: rgba(232, 197, 106, 0.14); color: var(--warn); }
.pill.high { background: rgba(224, 122, 106, 0.16); color: var(--bad); }
.pill.pr { background: var(--mint); color: #0B2019; }

.bar { height: 6px; background: var(--bg); border: 1px solid var(--line); border-radius: 999px; overflow: hidden; margin-top: 8px; }
.bar > i { display: block; height: 100%; background: var(--mint); }
.bar.low > i { background: var(--warn); }
.bar.high > i { background: var(--bad); }

.banner {
  border-radius: var(--radius); padding: 14px; margin-bottom: 10px;
  font-family: var(--mono); font-size: 10.5px; line-height: 1.7;
  text-transform: uppercase; letter-spacing: 0.04em;
  border: 1px solid;
}
.banner.ok { background: var(--mint-soft); border-color: rgba(58, 219, 134, 0.35); color: #C8E9D8; }
.banner.warn { background: rgba(232, 197, 106, 0.08); border-color: rgba(232, 197, 106, 0.35); color: #EBDDB0; }
.banner.stop { background: rgba(224, 122, 106, 0.09); border-color: rgba(224, 122, 106, 0.4); color: #F0C4BB; }
.banner b {
  display: block; margin-bottom: 5px;
  font-family: var(--display); font-size: 15px; font-weight: 800;
  text-transform: uppercase; letter-spacing: -0.01em; color: var(--cream);
}
.banner ul { margin: 4px 0 0; padding-left: 16px; }

.empty { text-align: center; color: var(--muted); padding: 44px 18px; }
.empty .big {
  font-family: var(--display); font-size: 26px; font-weight: 800;
  color: var(--mint); opacity: 0.45; margin-bottom: 10px;
  text-transform: uppercase; letter-spacing: 0.06em;
}
.empty strong { font-family: var(--display); font-size: 17px; color: var(--cream); }

table { width: 100%; border-collapse: collapse; font-family: var(--mono); font-size: 11.5px; }
th, td { text-align: left; padding: 9px 6px; border-bottom: 1px solid var(--line); }
th {
  color: var(--muted); font-size: 9.5px;
  text-transform: uppercase; letter-spacing: 0.1em; font-weight: 700;
}
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }

svg.chart { width: 100%; height: 150px; display: block; overflow: visible; }
svg.chart .grid-line { stroke: var(--line); stroke-width: 1; }
svg.chart .line { fill: none; stroke: var(--mint); stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
svg.chart .dot { fill: var(--mint); }
svg.chart .lbl { fill: var(--muted); font-size: 10px; font-family: var(--mono); }

/* --- fuel --- */
.fuel-count {
  font-family: var(--display); font-size: 30px; font-weight: 800;
  line-height: 1.1; letter-spacing: -0.03em; color: var(--cream);
  font-variant-numeric: tabular-nums;
}
.fuel-of { font-family: var(--mono); font-size: 13px; font-weight: 600; color: var(--muted); letter-spacing: 0; }
.fuel-bar { height: 8px; }
.fuel-list { display: flex; flex-direction: column; gap: 5px; }
.fuel-item {
  display: flex; align-items: center; gap: 10px;
  background: var(--bg); border: 1px solid var(--line);
  border-radius: 3px; padding: 8px 10px;
  font-family: var(--mono); font-size: 11px;
}
.fuel-item-label { flex: 1; min-width: 0; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); }
.fuel-remove {
  border: 0; background: transparent; color: var(--dim);
  font-size: 15px; line-height: 1; padding: 2px 4px; min-height: 0;
}

/* --- calendar --- */
.cal-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
.cal-title {
  font-family: var(--display); font-size: 17px; font-weight: 800;
  text-transform: uppercase; letter-spacing: -0.01em;
}
.cal-nav {
  width: 36px; height: 36px; border-radius: 3px; padding: 0;
  border: 1px solid var(--line-bright); background: transparent;
  color: var(--mint); font-size: 15px; line-height: 1;
}
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.cal-dow {
  text-align: center; font-family: var(--mono); font-size: 9px;
  font-weight: 700; color: var(--dim); letter-spacing: 0.1em; padding-bottom: 5px;
}
.cal-day {
  aspect-ratio: 1; display: grid; place-items: center;
  border-radius: 3px; font-family: var(--mono); font-size: 11.5px; font-weight: 600;
  font-variant-numeric: tabular-nums;
  border: 1px solid transparent; background: transparent;
  color: var(--dim); padding: 0; width: 100%;
}
.cal-day.empty { visibility: hidden; }
.cal-day.rest { color: var(--muted); border-color: var(--line); }
.cal-day.future { color: var(--dim); opacity: 0.4; }
.cal-day.trained { background: var(--mint); border-color: var(--mint); color: #0B2019; font-weight: 700; }
.cal-day.today { box-shadow: inset 0 0 0 1px var(--cream); }

.cal-legend {
  display: flex; flex-wrap: wrap; gap: 14px; margin-top: 16px;
  font-family: var(--mono); font-size: 9.5px; color: var(--muted);
  text-transform: uppercase; letter-spacing: 0.08em;
}
.cal-legend span { display: inline-flex; align-items: center; gap: 6px; }
.cal-legend i { width: 12px; height: 12px; border-radius: 2px; border: 1px solid var(--line-bright); display: inline-block; }
.cal-legend i.trained { background: var(--mint); border-color: var(--mint); }
.cal-legend i.rest { background: transparent; }
.cal-legend i.today { box-shadow: inset 0 0 0 1px var(--cream); }

/* --- rest timer --- */
.rest-bar {
  position: fixed; left: 12px; right: 12px;
  bottom: calc(var(--tabbar-h) + 10px + env(safe-area-inset-bottom));
  z-index: 30; display: flex; align-items: center; gap: 10px;
  background: var(--mint); color: #0B2019;
  border-radius: var(--radius); padding: 11px 13px;
  box-shadow: 0 8px 28px rgba(0, 0, 0, 0.5);
  max-width: 696px; margin: 0 auto;
}
.rest-bar[hidden] { display: none; }
.rest-bar .rest-label {
  font-family: var(--mono); font-size: 10px; font-weight: 700;
  letter-spacing: 0.14em; text-transform: uppercase; opacity: 0.7;
}
.rest-bar .rest-time {
  font-family: var(--display); font-size: 22px; font-weight: 800;
  font-variant-numeric: tabular-nums; margin-left: auto; letter-spacing: -0.02em;
}
.rest-bar .chip { background: rgba(11, 32, 25, 0.14); border-color: transparent; color: #0B2019; font-weight: 700; }

/* --- tabbar --- */
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 25;
  display: grid; grid-template-columns: repeat(5, 1fr);
  background: rgba(20, 44, 38, 0.97);
  backdrop-filter: blur(10px);
  border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom);
}
.tab {
  background: none; border: 0; color: var(--dim);
  display: flex; align-items: center; justify-content: center;
  height: var(--tabbar-h); padding: 8px 2px;
  font-family: var(--mono); font-size: 9.5px; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.1em;
  border-top: 2px solid transparent;
}
.tab[aria-selected="true"] { color: var(--mint); border-top-color: var(--mint); }

.toast {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: calc(var(--tabbar-h) + 22px + env(safe-area-inset-bottom));
  background: var(--surface-2); border: 1px solid var(--mint);
  color: var(--text); padding: 11px 18px; border-radius: var(--radius);
  z-index: 60; font-family: var(--mono); font-size: 11px; font-weight: 600;
  text-transform: uppercase; letter-spacing: 0.04em;
  box-shadow: 0 8px 26px rgba(0, 0, 0, 0.55);
  max-width: 90vw; text-align: center;
}

.muted { color: var(--muted); }
.small { font-family: var(--mono); font-size: 10.5px; line-height: 1.65; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.mt { margin-top: 12px; }
.hr { height: 1px; background: var(--line); margin: 16px 0; border: 0; }

.sync { font-size: 10px; line-height: 1; }
.sync-offline { color: var(--dim); }
.sync-syncing { color: var(--warn); }
.sync-synced  { color: var(--mint); }
.sync-error   { color: var(--bad); }

@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
  .btn:active { transform: none; }
}

/* --- one day's workout, opened from the calendar --- */
.cal-day.selected { box-shadow: inset 0 0 0 2px var(--cream); }
.day-detail { border-color: var(--mint); }
.day-detail-date {
  font-family: var(--display); font-size: 18px; font-weight: 800;
  text-transform: uppercase; letter-spacing: -0.01em; color: var(--cream);
}
.day-detail-session h3 { font-size: 16px; }
.detail-ex {
  border-top: 1px solid var(--line);
  padding: 10px 0 2px; margin-top: 8px;
}
.detail-ex-name { font-family: var(--display); font-weight: 600; font-size: 14px; }
.detail-sets { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 7px; }
.detail-set {
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--bg); border: 1px solid var(--line);
  border-radius: 3px; padding: 5px 9px;
  font-family: var(--mono); font-size: 11px;
  font-variant-numeric: tabular-nums; color: var(--text);
}
.detail-set-n { color: var(--dim); font-size: 9.5px; }
.detail-set-rpe { color: var(--muted); }

/* --- an exercise's role in the session, after the program sheet --- */
.role {
  font-family: var(--mono); font-size: 9px; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.09em;
  padding: 4px 9px; border-radius: 999px;
  border: 1px solid currentColor; white-space: nowrap;
}
.role-primary { color: var(--mint); }
.role-volume { color: #6FB6E8; }
.role-accent { color: #E88CC0; }
.role-quiet { color: var(--dim); }

.cue {
  font-family: var(--mono); font-size: 10.5px; line-height: 1.6;
  color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em;
  border-left: 2px solid var(--line-bright);
  padding: 6px 0 6px 10px; margin: 12px 0 0;
}

/* --- finishing must never be something you scroll to find --- */
.finish-bar {
  position: fixed; left: 0; right: 0;
  bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom));
  z-index: 26;
  display: flex; align-items: center; gap: 12px;
  padding: 10px 16px;
  background: var(--surface);
  border-top: 1px solid var(--mint);
}
.finish-bar[hidden] { display: none; }
.finish-progress { flex: 1; min-width: 0; }
.finish-count {
  display: block; font-family: var(--display); font-size: 17px;
  font-weight: 800; color: var(--cream); letter-spacing: -0.01em;
  font-variant-numeric: tabular-nums;
}
.finish-day {
  display: block; font-family: var(--mono); font-size: 9.5px;
  color: var(--muted); text-transform: uppercase; letter-spacing: 0.09em;
}
.finish-bar .btn { white-space: nowrap; }
.finish-bar .btn:disabled { opacity: 0.4; }

/* Make room so the last control is never trapped under the bar. */
body.has-finish-bar .view { padding-bottom: calc(var(--tabbar-h) + 160px); }
body.has-finish-bar .rest-bar { bottom: calc(var(--tabbar-h) + 76px + env(safe-area-inset-bottom)); }

/* A day with an unfinished workout on it. */
.cal-day.pending {
  border-color: var(--mint); border-style: dashed;
  color: var(--mint);
}
.cal-legend i.pending { border-color: var(--mint); border-style: dashed; background: transparent; }

</style>

const DEFAULT_PROGRAM_ID = 'block-a';

function getProgram(id) {
  return PROGRAMS[id] || PROGRAMS[DEFAULT_PROGRAM_ID];
}

function getDay(programId, dayId) {
  return getProgram(programId).days.find((d) => d.id === dayId) || null;
}

/** Planned weekly hard sets per muscle for a program. */
function plannedWeeklyVolume(programId) {
  const out = {};
  for (const day of getProgram(programId).days) {
    for (const e of day.exercises) out[e.muscle] = (out[e.muscle] || 0) + e.sets;
  }
  return out;
}

/** How a prescription reads on screen: "3 × 10–12", "3 × 45–60 sec". */
function prescription(e) {
  const [low, high] = e.repRange;
  const range = low === high ? `${low}` : `${low}–${high}`;
  const unit = e.unit === 'sec' ? ' sec' : '';
  const side = e.perSide ? ' each side' : '';
  return `${e.sets} × ${range}${unit}${side}`;
}

// ---------- src/core/training.js ----------
// Set math, progression suggestions, PR detection, volume analysis.

/** Epley estimated 1RM. Reps above 12 get unreliable, so we cap the input. */
function estimated1RM(weight, reps) {
  if (!Number.isFinite(weight) || !Number.isFinite(reps) || weight <= 0 || reps <= 0) return 0;
  const r = Math.min(reps, 12);
  return Math.round(weight * (1 + r / 30) * 10) / 10;
}

const isCompleted = (s) => !!s && s.done && Number(s.reps) > 0;

function sessionVolume(session) {
  let v = 0;
  for (const entry of session?.entries || []) {
    for (const s of entry.sets || []) {
      if (isCompleted(s)) v += Number(s.weight || 0) * Number(s.reps);
    }
  }
  return Math.round(v);
}

function sessionHardSets(session) {
  let n = 0;
  for (const entry of session?.entries || []) {
    for (const s of entry.sets || []) if (isCompleted(s)) n += 1;
  }
  return n;
}

/** Best set of an entry, ranked by estimated 1RM. */
function bestSet(entry) {
  let best = null;
  for (const s of entry?.sets || []) {
    if (!isCompleted(s)) continue;
    const e1 = estimated1RM(Number(s.weight), Number(s.reps));
    if (!best || e1 > best.e1rm) best = { weight: Number(s.weight), reps: Number(s.reps), e1rm: e1 };
  }
  return best;
}

/**
 * Double progression.
 * Every completed set at or above the top of the rep range -> add weight.
 * Any completed set below the bottom -> drop weight.
 * Otherwise keep the weight and chase reps.
 */
function suggestNext(lastEntry, exercise) {
  const [low, high] = exercise?.repRange || [8, 12];
  const done = (lastEntry?.sets || []).filter(isCompleted);
  if (!done.length) {
    return { weight: null, reps: low, reason: 'First time — pick a weight you can control for ' + low + ' reps.' };
  }

  const weights = done.map((s) => Number(s.weight) || 0);
  const topWeight = Math.max(...weights);
  const atTop = done.filter((s) => Number(s.weight) === topWeight);
  const increment = exercise?.type === 'compound' ? (isLowerBody(exercise) ? 10 : 5) : 5;

  if (atTop.every((s) => Number(s.reps) >= high)) {
    return {
      weight: round2p5(topWeight + increment),
      reps: low,
      reason: `Hit ${high} reps on every set — add ${increment} lb and rebuild to ${high}.`,
    };
  }
  if (atTop.some((s) => Number(s.reps) < low)) {
    return {
      weight: round2p5(Math.max(0, topWeight - increment)),
      reps: low,
      reason: `Fell under ${low} reps — drop ${increment} lb and earn it back.`,
    };
  }
  const minReps = Math.min(...atTop.map((s) => Number(s.reps)));
  return {
    weight: topWeight,
    reps: Math.min(high, minReps + 1),
    reason: `Same weight — beat ${minReps} reps on your worst set.`,
  };
}

const isLowerBody = (e) => ['quads', 'hamstrings', 'glutes'].includes(e?.muscle);
const round2p5 = (w) => Math.round(w * 2) / 2;

/**
 * Personal records for one exercise across history, oldest first.
 * @returns {{e1rm:number, weight:number, reps:number, date:string}|null}
 */
function exercisePR(sessions, exerciseId) {
  let pr = null;
  for (const s of sessions || []) {
    const entry = (s.entries || []).find((e) => e.exerciseId === exerciseId);
    if (!entry) continue;
    const b = bestSet(entry);
    if (b && (!pr || b.e1rm > pr.e1rm)) pr = { ...b, date: s.date };
  }
  return pr;
}

/** True when this session set a new estimated-1RM record vs everything before it. */
function isNewPR(sessions, session, exerciseId) {
  const prior = (sessions || []).filter((s) => s.id !== session.id && s.date <= session.date);
  const before = exercisePR(prior, exerciseId);
  const entry = (session.entries || []).find((e) => e.exerciseId === exerciseId);
  const now = entry ? bestSet(entry) : null;
  if (!now) return false;
  return !before || now.e1rm > before.e1rm;
}

/** Estimated-1RM series for charting, one point per session. */
function e1rmSeries(sessions, exerciseId) {
  return (sessions || [])
    .map((s) => {
      const entry = (s.entries || []).find((e) => e.exerciseId === exerciseId);
      const b = entry ? bestSet(entry) : null;
      return b ? { date: s.date, value: b.e1rm } : null;
    })
    .filter(Boolean)
    .sort((a, b) => a.date.localeCompare(b.date));
}

/** Completed hard sets per muscle over the last `days` days. */
function volumeByMuscle(sessions, exerciseIndex, days = 7, now = new Date()) {
  const cutoff = new Date(now.getTime() - days * 86400000).toISOString().slice(0, 10);
  const out = {};
  for (const s of sessions || []) {
    if (s.date < cutoff) continue;
    for (const entry of s.entries || []) {
      const muscle = exerciseIndex[entry.exerciseId]?.muscle || entry.muscle || 'other';
      const n = (entry.sets || []).filter(isCompleted).length;
      if (n) out[muscle] = (out[muscle] || 0) + n;
    }
  }
  return out;
}

// Weekly hard-set landmarks for hypertrophy (Israetel-style ranges).
const VOLUME_LANDMARKS = {
  quads: [8, 20],
  hamstrings: [6, 16],
  glutes: [4, 16],
  calves: [6, 20],
  chest: [8, 22],
  back: [10, 25],
  shoulders: [8, 22],
  biceps: [6, 18],
  triceps: [6, 18],
  core: [6, 20],
};

/**
 * Flags muscles under the minimum effective volume or past the point where
 * extra sets stop paying. Sorted worst-first so the UI can lead with it.
 */
function volumeAudit(volume) {
  const rows = [];
  for (const [muscle, [min, max]] of Object.entries(VOLUME_LANDMARKS)) {
    const sets = volume[muscle] || 0;
    let status = 'ok';
    let note = `${sets} sets — in range (${min}-${max}).`;
    if (sets < min) {
      status = 'low';
      note = `${sets} sets — below ${min}, not enough to grow.`;
    } else if (sets > max) {
      status = 'high';
      note = `${sets} sets — above ${max}, past the useful range.`;
    }
    rows.push({ muscle, sets, min, max, status, note });
  }
  const rank = { low: 0, high: 1, ok: 2 };
  return rows.sort((a, b) => rank[a.status] - rank[b.status] || b.sets - a.sets);
}

/** Flat id -> exercise map across every day of a program. */
function buildExerciseIndex(program) {
  const idx = {};
  for (const day of program?.days || []) {
    for (const e of day.exercises) idx[e.id] = e;
  }
  return idx;
}

// ---------- src/core/nutrition.js ----------
// Body-composition math and calorie/macro targets.
// All internal math is metric; callers pass/receive pounds.

const LB_PER_KG = 2.2046226218;

const lbToKg = (lb) => lb / LB_PER_KG;
const kgToLb = (kg) => kg * LB_PER_KG;

/**
 * Katch-McArdle BMR from lean body mass. This is the formula InBody uses,
 * so it reproduces the number printed on the sheet.
 */
function bmrFromLbm(lbmLb) {
  return Math.round(370 + 21.6 * lbToKg(lbmLb));
}

const ACTIVITY = {
  sedentary: { id: 'sedentary', label: 'Desk job, no steps', factor: 1.25 },
  light: { id: 'light', label: 'Light (3 lifts/wk)', factor: 1.4 },
  moderate: { id: 'moderate', label: 'Moderate (4 lifts/wk)', factor: 1.5 },
  high: { id: 'high', label: 'High (4 lifts + cardio/active job)', factor: 1.65 },
};

const PHASES = {
  bulk: { id: 'bulk', label: 'Lean bulk', surplusPct: 0.12 },
  maintain: { id: 'maintain', label: 'Maintain', surplusPct: 0 },
  cut: { id: 'cut', label: 'Cut', surplusPct: -0.2 },
};

function tdee(bmr, activityId) {
  const a = ACTIVITY[activityId] || ACTIVITY.moderate;
  return Math.round(bmr * a.factor);
}

/**
 * Macro targets.
 * Protein: 1.1 g per lb of LEAN mass (scales correctly at any body fat level).
 * Fat: 25% of calories, floored at 0.3 g/lb bodyweight for hormonal health.
 * Carbs: whatever is left.
 */
function macroTargets({ weightLb, bodyFatPct, activityId = 'moderate', phaseId = 'bulk' }) {
  const fatMass = weightLb * (bodyFatPct / 100);
  const lbm = weightLb - fatMass;
  const bmr = bmrFromLbm(lbm);
  const maintenance = tdee(bmr, activityId);
  const phase = PHASES[phaseId] || PHASES.bulk;
  const calories = Math.round(maintenance * (1 + phase.surplusPct));

  const protein = Math.round(1.1 * lbm);
  const fatFromPct = (calories * 0.25) / 9;
  const fatFloor = 0.3 * weightLb;
  const fat = Math.round(Math.max(fatFromPct, fatFloor));
  const carbs = Math.max(0, Math.round((calories - protein * 4 - fat * 9) / 4));

  return { lbm: round1(lbm), fatMass: round1(fatMass), bmr, maintenance, calories, protein, fat, carbs, phase: phase.id };
}

const round1 = (n) => Math.round(n * 10) / 10;

/**
 * Weekly rate of weight change from a series of bodyweight entries,
 * using a least-squares fit so day-to-day water noise does not dominate.
 * @param {{date:string, weight:number}[]} entries
 * @returns {number|null} pounds per week, or null if under 2 distinct days
 */
function weeklyRate(entries) {
  const pts = (entries || [])
    .filter((e) => Number.isFinite(e.weight) && e.date)
    .map((e) => ({ t: Date.parse(e.date) / 86400000, w: e.weight }))
    .filter((p) => Number.isFinite(p.t))
    .sort((a, b) => a.t - b.t);
  if (pts.length < 2) return null;
  const spanDays = pts[pts.length - 1].t - pts[0].t;
  if (spanDays <= 0) return null;

  const n = pts.length;
  const mt = pts.reduce((s, p) => s + p.t, 0) / n;
  const mw = pts.reduce((s, p) => s + p.w, 0) / n;
  let num = 0;
  let den = 0;
  for (const p of pts) {
    num += (p.t - mt) * (p.w - mw);
    den += (p.t - mt) ** 2;
  }
  if (den === 0) return null;
  return round2((num / den) * 7);
}

const round2 = (n) => Math.round(n * 100) / 100;

/**
 * Bulking guardrail. A lean bulk should run 0.25-0.5 lb/wk; faster than that is
 * mostly fat, and past the body-fat ceiling the surplus stops being worth it.
 */
function bulkCheck({ rateLbPerWeek, bodyFatPct, ceilingPct = 20, phaseId = 'bulk' }) {
  const msgs = [];
  let status = 'ok';

  if (phaseId === 'bulk') {
    if (Number.isFinite(bodyFatPct) && bodyFatPct >= ceilingPct) {
      status = 'stop';
      msgs.push(`Body fat is ${bodyFatPct}% — at or past your ${ceilingPct}% ceiling. Switch to a cut.`);
    }
    if (rateLbPerWeek != null) {
      if (rateLbPerWeek > 0.75) {
        if (status !== 'stop') status = 'warn';
        msgs.push(`Gaining ${rateLbPerWeek} lb/wk — too fast. Cut 200-300 kcal.`);
      } else if (rateLbPerWeek < 0.1) {
        if (status !== 'stop') status = 'warn';
        msgs.push(`Gaining ${rateLbPerWeek} lb/wk — too slow to build. Add 150-250 kcal.`);
      } else {
        msgs.push(`Gaining ${rateLbPerWeek} lb/wk — right in the lean-bulk window.`);
      }
    }
  } else if (phaseId === 'cut') {
    if (rateLbPerWeek != null) {
      if (rateLbPerWeek > -0.1) {
        status = 'warn';
        msgs.push(`Losing ${(-rateLbPerWeek).toFixed(2)} lb/wk — not enough deficit.`);
      } else if (rateLbPerWeek < -1.5) {
        status = 'warn';
        msgs.push(`Losing ${(-rateLbPerWeek).toFixed(2)} lb/wk — fast enough to cost muscle. Add 200 kcal.`);
      } else {
        msgs.push(`Losing ${(-rateLbPerWeek).toFixed(2)} lb/wk — good rate.`);
      }
    }
  }

  if (!msgs.length) msgs.push('Log a few bodyweights to get a trend.');
  return { status, messages: msgs };
}

/** Where a given body fat % sits for a male. */
function bodyFatBand(pct) {
  if (!Number.isFinite(pct)) return null;
  if (pct < 6) return { band: 'essential', label: 'Essential fat — not sustainable' };
  if (pct < 11) return { band: 'lean', label: 'Lean / stage-ready' };
  if (pct < 15) return { band: 'athletic', label: 'Athletic' };
  if (pct < 20) return { band: 'fit', label: 'Fit — good place to bulk from' };
  if (pct < 25) return { band: 'average', label: 'Average — cut before bulking further' };
  return { band: 'high', label: 'High — prioritise a cut' };
}

// ---------- src/core/store.js ----------
// Persistence. Backed by localStorage in the browser; any object with the
// getItem/setItem shape works, which is what makes it unit-testable in node.

const STORAGE_KEY = 'zolf-lift:v1';
const SCHEMA_VERSION = 1;

/**
 * localStorage that cannot take the app down with it.
 *
 * An artifact runs in a sandboxed cross-origin iframe. iOS Safari — in Private
 * Browsing, with site data blocked, or simply with partitioned third-party
 * storage — makes `localStorage.setItem` THROW there. An unguarded write meant
 * every mutation threw out of its click handler, so taps did nothing at all.
 * Persistence is a convenience; logging a set is not. When the real store is
 * unusable we fall back to memory and say so, rather than failing.
 */
function safeBackend(candidate) {
  const memory = memoryBackend();
  let usable = false;
  try {
    const probe = '__zolf_probe__';
    candidate.setItem(probe, '1');
    candidate.removeItem(probe);
    usable = true;
  } catch {
    usable = false;
  }

  const store = usable ? candidate : memory;
  const backend = {
    persistent: usable,
    lastError: usable ? null : 'This browser is blocking storage for this page.',
    getItem(key) {
      try {
        return store.getItem(key);
      } catch (err) {
        backend.persistent = false;
        backend.lastError = String(err?.message || err);
        return memory.getItem(key);
      }
    },
    setItem(key, value) {
      try {
        store.setItem(key, value);
      } catch (err) {
        // Quota, or storage revoked mid-session. Keep going in memory.
        backend.persistent = false;
        backend.lastError = String(err?.message || err);
        memory.setItem(key, value);
      }
    },
    removeItem(key) {
      try {
        store.removeItem(key);
      } catch {
        memory.removeItem(key);
      }
    },
  };
  return backend;
}

function memoryBackend(initial = {}) {
  const data = { ...initial };
  return {
    getItem: (k) => (k in data ? data[k] : null),
    setItem: (k, v) => {
      data[k] = String(v);
    },
    removeItem: (k) => {
      delete data[k];
    },
  };
}

function defaultState() {
  return {
    version: SCHEMA_VERSION,
    updatedAt: 0,
    settings: {
      programId: DEFAULT_PROGRAM_ID,
      activityId: 'moderate',
      phaseId: 'bulk',
      bodyFatCeiling: 20,
      restSeconds: 150,
      units: 'lb',
    },
    sessions: [],
    metrics: [],
    bodyweights: [],
    protein: [],
    creatine: [],
    active: null,
  };
}

const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36);

class Store {
  constructor(backend) {
    this.backend = backend;
    this.listeners = new Set();
    this.lastError = null;
    this.state = this.load();
  }

  load() {
    try {
      const raw = this.backend.getItem(STORAGE_KEY);
      if (!raw) return defaultState();
      const parsed = JSON.parse(raw);
      return migrate(parsed);
    } catch {
      return defaultState();
    }
  }

  /**
   * Persist, then notify. Neither step may throw: a storage failure must not
   * stop a set being logged, and one broken listener must not stop the others.
   */
  save() {
    try {
      this.backend.setItem(STORAGE_KEY, JSON.stringify(this.state));
    } catch (err) {
      this.lastError = String(err?.message || err);
    }
    for (const fn of [...this.listeners]) {
      try {
        fn(this.state);
      } catch (err) {
        this.lastError = String(err?.message || err);
      }
    }
  }

  /** Whether writes are actually reaching durable storage on this device. */
  get persistent() {
    return this.backend.persistent !== false;
  }

  subscribe(fn) {
    this.listeners.add(fn);
    return () => this.listeners.delete(fn);
  }

  update(fn) {
    const next = fn(this.state);
    if (next) this.state = next;
    // Stamped on mutation, not on save, so import and reset reproduce their
    // source byte for byte. mergeStates uses this to settle conflicts.
    this.state = { ...this.state, updatedAt: Date.now() };
    this.save();
    return this.state;
  }

  // --- settings ---
  setSetting(key, value) {
    return this.update((s) => ({ ...s, settings: { ...s.settings, [key]: value } }));
  }

  // --- workout session lifecycle ---
  /**
   * @param day       the program day being started
   * @param date      ISO date for the session
   * @param prefill   (exercise) => reps to put in each row. Reps arrive filled
   *                  in so the only thing to type at the rack is the weight;
   *                  weight is deliberately left blank.
   */
  startSession(day, date = today(), prefill = null) {
    const session = {
      id: uid(),
      dayId: day.id,
      dayName: day.name,
      date,
      startedAt: new Date().toISOString(),
      finishedAt: null,
      note: '',
      entries: day.exercises.map((e) => ({
        exerciseId: e.id,
        name: e.name,
        muscle: e.muscle,
        targetReps: e.repRange,
        sets: Array.from({ length: e.sets }, () => ({
          weight: '',
          reps: prefill ? String(prefill(e) ?? '') : '',
          rpe: '',
          done: false,
        })),
      })),
    };
    this.update((s) => ({ ...s, active: session }));
    return session;
  }

  updateActive(fn) {
    return this.update((s) => (s.active ? { ...s, active: fn(structuredClone(s.active)) } : s));
  }

  setSet(exerciseId, setIndex, patch) {
    return this.updateActive((a) => {
      const entry = a.entries.find((e) => e.exerciseId === exerciseId);
      if (!entry) return a;
      while (entry.sets.length <= setIndex) entry.sets.push({ weight: '', reps: '', rpe: '', done: false });
      entry.sets[setIndex] = { ...entry.sets[setIndex], ...patch };
      return a;
    });
  }

  addSet(exerciseId) {
    return this.updateActive((a) => {
      const entry = a.entries.find((e) => e.exerciseId === exerciseId);
      if (entry) {
        // An added set inherits the last one, so a third set is one tap.
        const last = entry.sets[entry.sets.length - 1];
        entry.sets.push({ weight: last?.weight ?? '', reps: last?.reps ?? '', rpe: '', done: false });
      }
      return a;
    });
  }

  removeSet(exerciseId, setIndex) {
    return this.updateActive((a) => {
      const entry = a.entries.find((e) => e.exerciseId === exerciseId);
      if (entry && entry.sets.length > 1) entry.sets.splice(setIndex, 1);
      return a;
    });
  }

  /** Drops empty sets and files the session into history. */
  finishSession() {
    const active = this.state.active;
    if (!active) return null;
    const entries = active.entries
      .map((e) => ({ ...e, sets: e.sets.filter((s) => s.done && Number(s.reps) > 0) }))
      .filter((e) => e.sets.length);
    if (!entries.length) {
      this.update((s) => ({ ...s, active: null }));
      return null;
    }
    const done = { ...active, entries, finishedAt: new Date().toISOString() };
    this.update((s) => ({
      ...s,
      active: null,
      sessions: [...s.sessions, done].sort((a, b) => a.date.localeCompare(b.date)),
    }));
    return done;
  }

  discardSession() {
    return this.update((s) => ({ ...s, active: null }));
  }

  deleteSession(id) {
    return this.update((s) => ({ ...s, sessions: s.sessions.filter((x) => x.id !== id) }));
  }

  /** Most recent finished session containing this exercise. */
  lastEntryFor(exerciseId, excludeSessionId = null) {
    const sessions = [...this.state.sessions]
      .filter((s) => s.id !== excludeSessionId)
      .sort((a, b) => b.date.localeCompare(a.date));
    for (const s of sessions) {
      const entry = s.entries.find((e) => e.exerciseId === exerciseId);
      if (entry && entry.sets.length) return { entry, session: s };
    }
    return null;
  }

  // --- body data ---
  addBodyweight(weight, date = today()) {
    const w = Number(weight);
    if (!Number.isFinite(w) || w <= 0) return this.state;
    return this.update((s) => ({
      ...s,
      bodyweights: [...s.bodyweights.filter((b) => b.date !== date), { id: uid(), date, weight: w }].sort((a, b) =>
        a.date.localeCompare(b.date)
      ),
    }));
  }

  // --- daily fuel ---

  /** Protein is many entries a day, so each one is kept separately. */
  addProtein(grams, label = '', date = today()) {
    const g = Number(grams);
    if (!Number.isFinite(g) || g <= 0) return this.state;
    return this.update((s) => ({
      ...s,
      protein: [...s.protein, { id: uid(), date, grams: g, label: String(label || '') }],
    }));
  }

  removeProtein(id) {
    return this.update((s) => ({ ...s, protein: s.protein.filter((p) => p.id !== id) }));
  }

  /** Creatine is one dose a day; logging again replaces it. */
  setCreatine(grams, date = today()) {
    const g = Number(grams);
    const rest = this.state.creatine.filter((c) => c.date !== date);
    if (!Number.isFinite(g) || g <= 0) {
      return this.update((s) => ({ ...s, creatine: rest }));
    }
    return this.update((s) => ({
      ...s,
      creatine: [...rest, { id: uid(), date, grams: g }].sort((a, b) => a.date.localeCompare(b.date)),
    }));
  }

  addMetric(metric) {
    const m = { id: uid(), date: today(), ...metric };
    return this.update((s) => ({
      ...s,
      metrics: [...s.metrics.filter((x) => x.date !== m.date), m].sort((a, b) => a.date.localeCompare(b.date)),
    }));
  }

  deleteMetric(id) {
    return this.update((s) => ({ ...s, metrics: s.metrics.filter((m) => m.id !== id) }));
  }

  latestMetric() {
    return this.state.metrics.length ? this.state.metrics[this.state.metrics.length - 1] : null;
  }

  // --- backup ---
  exportJSON() {
    return JSON.stringify(this.state, null, 2);
  }

  importJSON(text) {
    const parsed = JSON.parse(text);
    if (!parsed || typeof parsed !== 'object' || !Array.isArray(parsed.sessions)) {
      throw new Error('Not a valid backup file');
    }
    this.state = migrate(parsed);
    this.save();
    return this.state;
  }

  reset() {
    this.state = defaultState();
    this.save();
    return this.state;
  }
}

function today(d = new Date()) {
  const off = d.getTimezoneOffset() * 60000;
  return new Date(d.getTime() - off).toISOString().slice(0, 10);
}

/** Fills in anything a stored or imported payload is missing. */
function migrate(raw) {
  const base = defaultState();
  const state = {
    ...base,
    ...raw,
    version: SCHEMA_VERSION,
    updatedAt: Number(raw.updatedAt) || 0,
    settings: { ...base.settings, ...(raw.settings || {}) },
    sessions: Array.isArray(raw.sessions) ? raw.sessions : [],
    metrics: Array.isArray(raw.metrics) ? raw.metrics : [],
    bodyweights: Array.isArray(raw.bodyweights) ? raw.bodyweights : [],
    protein: Array.isArray(raw.protein) ? raw.protein : [],
    creatine: Array.isArray(raw.creatine) ? raw.creatine : [],
    active: raw.active || null,
  };
  state.sessions.sort((a, b) => String(a.date).localeCompare(String(b.date)));
  state.bodyweights.sort((a, b) => String(a.date).localeCompare(String(b.date)));
  state.metrics.sort((a, b) => String(a.date).localeCompare(String(b.date)));
  state.protein.sort((a, b) => String(a.date).localeCompare(String(b.date)));
  state.creatine.sort((a, b) => String(a.date).localeCompare(String(b.date)));
  return state;
}

// ---------- src/core/sync.js ----------
// Cross-device sync.
//
// localStorage stays the source of truth for the current tab: it is
// synchronous, works offline, and every reducer in store.js is built on it.
// This layer mirrors that state into the artifact `db` document so the log
// survives a cleared browser and follows you between phone and laptop.
//
// mergeStates is pure so the conflict rules can be tested without a network.

/** Union two lists keyed by `key`, preferring entries from the newer state. */
function unionBy(localList, remoteList, key, localWins) {
  const out = new Map();
  const first = localWins ? remoteList : localList;
  const second = localWins ? localList : remoteList;
  for (const item of first || []) out.set(item[key], item);
  for (const item of second || []) out.set(item[key], item);
  return [...out.values()];
}

/**
 * Merge a local and a remote snapshot without losing work from either side.
 *
 * Sessions are unioned by id, so a workout logged on one device can never be
 * erased by a stale snapshot from another. Bodyweights and scans are unioned by
 * date, since the app keeps one of each per day. Single-valued fields
 * (settings, the in-progress workout) follow whichever snapshot is newer.
 */
function mergeStates(local, remote) {
  if (!remote) return local;
  if (!local) return remote;

  const localAt = Number(local.updatedAt) || 0;
  const remoteAt = Number(remote.updatedAt) || 0;
  const localWins = localAt >= remoteAt;
  const newer = localWins ? local : remote;

  const sessions = unionBy(local.sessions, remote.sessions, 'id', localWins).sort((a, b) =>
    String(a.date).localeCompare(String(b.date))
  );
  const bodyweights = unionBy(local.bodyweights, remote.bodyweights, 'date', localWins).sort((a, b) =>
    String(a.date).localeCompare(String(b.date))
  );
  const metrics = unionBy(local.metrics, remote.metrics, 'date', localWins).sort((a, b) =>
    String(a.date).localeCompare(String(b.date))
  );
  // Protein is many entries a day, so it unions by id like sessions do;
  // creatine is one dose a day and unions by date.
  const protein = unionBy(local.protein, remote.protein, 'id', localWins).sort((a, b) =>
    String(a.date).localeCompare(String(b.date))
  );
  const creatine = unionBy(local.creatine, remote.creatine, 'date', localWins).sort((a, b) =>
    String(a.date).localeCompare(String(b.date))
  );

  return {
    ...newer,
    sessions,
    bodyweights,
    metrics,
    protein,
    creatine,
    settings: { ...(localWins ? remote.settings : local.settings), ...(newer.settings || {}) },
    // An in-progress workout on THIS device always wins. Losing the sets you
    // are part-way through is the worst thing sync could do; a stale active
    // session left on another device is a shrug you can discard by hand.
    active: local.active ?? remote.active ?? null,
    updatedAt: Math.max(localAt, remoteAt),
  };
}

/** True when two snapshots would produce identical stored documents. */
function sameState(a, b) {
  return JSON.stringify(stripVolatile(a)) === JSON.stringify(stripVolatile(b));
}

const stripVolatile = (s) => {
  if (!s) return s;
  const { updatedAt, ...rest } = s;
  return rest;
};

const DOC_PATH = 'log/state';

/** Does this look like one of our snapshots, rather than some wrapper object? */
function isStateLike(x) {
  if (!x || typeof x !== 'object' || Array.isArray(x)) return false;
  return (
    Array.isArray(x.sessions) ||
    Array.isArray(x.bodyweights) ||
    Array.isArray(x.protein) ||
    (!!x.settings && typeof x.settings === 'object')
  );
}

/**
 * Pull our state out of whatever the store hands back.
 *
 * The document API may return the payload directly, behind a `data` property,
 * or behind a Firestore-style `data()` method, and we wrap the state in
 * `{state, updatedAt}` on the way in. Guessing wrong once meant merging a
 * wrapper object as if it were a state, so anything unrecognisable is refused
 * outright rather than merged.
 */
function unwrapSnapshot(snapshot) {
  if (!snapshot || typeof snapshot !== 'object') return null;
  if (snapshot.exists === false) return null;

  let raw = snapshot;
  if (typeof raw.data === 'function') {
    try {
      raw = raw.data();
    } catch {
      return null;
    }
  } else if (raw.data && typeof raw.data === 'object') {
    raw = raw.data;
  }
  if (!raw || typeof raw !== 'object') return null;
  if (raw.state && typeof raw.state === 'object') raw = raw.state;
  return isStateLike(raw) ? raw : null;
}

/**
 * Mirrors a Store into a db document and back.
 *
 * Every method tolerates the capability being absent or failing: this is a
 * convenience layer over storage that already works, so a sync error must
 * never take the app down or block a set from being logged.
 */
class Syncer {
  /**
   * @param {object} store        a Store instance
   * @param {object} opts.db      the resolved `db` capability, or null
   * @param {number} opts.debounceMs how long to batch writes
   */
  constructor(store, { db, debounceMs = 900, onStatus = () => {}, onRemoteChange = () => {} } = {}) {
    this.store = store;
    this.db = db;
    this.debounceMs = debounceMs;
    this.onStatus = onStatus;
    // Fired only when data arrives from elsewhere. The UI re-renders on this
    // and not on every local write, which would steal focus mid-keystroke.
    this.onRemoteChange = onRemoteChange;
    this.timer = null;
    this.lastPushed = null;
    this.unsubscribes = [];
    this.status = 'offline';
  }

  setStatus(status, detail) {
    this.status = status;
    try {
      this.onStatus(status, detail);
    } catch {
      /* a status listener must never break sync */
    }
  }

  /** Pull, merge, push, then watch. Safe to call when db is null. */
  async start() {
    if (!this.db) return this.setStatus('offline');
    this.setStatus('syncing');
    try {
      const doc = this.db.doc(DOC_PATH);
      const merged = mergeStates(this.store.state, unwrapSnapshot(await doc.get()));
      if (merged && !sameState(merged, this.store.state)) {
        this.applyRemote(merged);
      }
      await this.push(true);
      this.watch(doc);
      this.unsubscribes.push(this.store.subscribe(() => this.schedulePush()));
      this.setStatus('synced');
    } catch (err) {
      this.setStatus('error', err);
    }
  }

  watch(doc) {
    if (typeof doc.onSnapshot !== 'function') return;
    try {
      const off = doc.onSnapshot((snapshot) => {
        const incoming = unwrapSnapshot(snapshot);
        if (!incoming) return;
        const merged = mergeStates(this.store.state, incoming);
        if (!sameState(merged, this.store.state)) this.applyRemote(merged);
      });
      if (typeof off === 'function') this.unsubscribes.push(off);
    } catch {
      /* watching is best effort */
    }
  }

  applyRemote(merged) {
    this.store.state = merged;
    this.store.save();
    try {
      this.onRemoteChange(merged);
    } catch {
      /* a listener must never break sync */
    }
  }

  schedulePush() {
    if (!this.db) return;
    clearTimeout(this.timer);
    this.timer = setTimeout(() => this.push(), this.debounceMs);
  }

  async push(force = false) {
    if (!this.db) return false;
    const state = this.store.state;
    if (!force && this.lastPushed && sameState(this.lastPushed, state)) return false;
    try {
      this.setStatus('syncing');
      await this.db.doc(DOC_PATH).set({ state, updatedAt: Date.now() });
      this.lastPushed = structuredClone(state);
      this.setStatus('synced');
      return true;
    } catch (err) {
      this.setStatus('error', err);
      return false;
    }
  }

  stop() {
    clearTimeout(this.timer);
    for (const off of this.unsubscribes) {
      try {
        off();
      } catch {
        /* ignore */
      }
    }
    this.unsubscribes = [];
  }
}

// ---------- src/core/calendar.js ----------
// Month-grid maths for the training calendar. Pure and timezone-free: every
// date is handled as a 'YYYY-MM-DD' string so a late-evening workout never
// lands on the wrong day.

const MONTH_NAMES = [
  'January', 'February', 'March', 'April', 'May', 'June',
  'July', 'August', 'September', 'October', 'November', 'December',
];

const DAY_INITIALS = ['S', 'M', 'T', 'W', 'T', 'F', 'S'];

const iso = (y, m, d) =>
  `${y}-${String(m + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;

const parseIso = (s) => {
  const [y, m, d] = String(s).split('-').map(Number);
  return { y, m: m - 1, d };
};

const daysInMonth = (y, m) => new Date(y, m + 1, 0).getDate();

/** Steps a year/month pair by `delta` months, rolling the year over. */
function shiftMonth(y, m, delta) {
  const total = y * 12 + m + delta;
  return { y: Math.floor(total / 12), m: ((total % 12) + 12) % 12 };
}

/**
 * A month laid out as calendar weeks.
 * Leading and trailing cells are null so each row is exactly seven wide.
 * @returns {(string|null)[][]}
 */
function monthGrid(y, m) {
  const lead = new Date(y, m, 1).getDay();
  const total = daysInMonth(y, m);
  const cells = [...Array(lead).fill(null), ...Array.from({ length: total }, (_, i) => iso(y, m, i + 1))];
  while (cells.length % 7) cells.push(null);
  const weeks = [];
  for (let i = 0; i < cells.length; i += 7) weeks.push(cells.slice(i, i + 7));
  return weeks;
}

/**
 * Index of sessions by date. A date can hold more than one session, so the
 * value is a list — two-a-days should not silently disappear.
 * @returns {Record<string, object[]>}
 */
function sessionsByDate(sessions) {
  const out = {};
  for (const s of sessions || []) {
    if (!s?.date) continue;
    (out[s.date] ||= []).push(s);
  }
  return out;
}

/** How each day of a month should be drawn. */
function monthDays(sessions, y, m, todayIso) {
  const byDate = sessionsByDate(sessions);
  return monthGrid(y, m).map((week) =>
    week.map((date) => {
      if (!date) return null;
      const trained = byDate[date] || [];
      return {
        date,
        day: parseIso(date).d,
        trained: trained.length > 0,
        sessions: trained,
        dayId: trained[0]?.dayId || null,
        label: trained.map((s) => s.dayName || s.dayId).join(' + '),
        isToday: date === todayIso,
        isFuture: date > todayIso,
      };
    })
  );
}

/** Counts for the month being viewed. */
function monthSummary(sessions, y, m, todayIso) {
  const byDate = sessionsByDate(sessions);
  const total = daysInMonth(y, m);
  let trainedDays = 0;
  let sessionCount = 0;
  let restDays = 0;
  for (let d = 1; d <= total; d++) {
    const date = iso(y, m, d);
    const hits = byDate[date];
    if (hits?.length) {
      trainedDays += 1;
      sessionCount += hits.length;
    } else if (date <= todayIso) {
      restDays += 1;
    }
  }
  return { trainedDays, sessionCount, restDays, daysInMonth: total };
}

/**
 * Sessions in the last `days` days, counting today.
 *
 * This replaced a consecutive-weeks streak, which read "0 weeks" for anyone
 * training three times a week and gave no signal on the day you looked at it.
 * A rolling count against your target frequency is useful every day.
 */
function sessionsInLastDays(sessions, todayIso, days = 7) {
  const byDate = sessionsByDate(sessions);
  const { y, m, d } = parseIso(todayIso);
  let count = 0;
  for (let i = 0; i < days; i++) {
    const date = new Date(Date.UTC(y, m, d - i)).toISOString().slice(0, 10);
    count += (byDate[date] || []).length;
  }
  return count;
}

/** Whole days since the last session, or null if nothing has been logged. */
function daysSinceLastSession(sessions, todayIso) {
  const dates = (sessions || []).map((s) => s.date).filter(Boolean).sort();
  const last = dates[dates.length - 1];
  if (!last) return null;
  const a = parseIso(last);
  const b = parseIso(todayIso);
  return Math.round((Date.UTC(b.y, b.m, b.d) - Date.UTC(a.y, a.m, a.d)) / 86400000);
}

// ---------- src/core/supplements.js ----------
// Daily fuel: protein intake and creatine adherence.
//
// Protein is many entries a day summed against a target; creatine is one dose
// a day where consistency is the whole point, so it is measured as a streak and
// as adherence over a window rather than as a total.

const CREATINE_DEFAULT_G = 5;

/** Quick-add amounts, in grams of protein. */
const PROTEIN_PRESETS = [
  { label: 'Whey scoop', grams: 25 },
  { label: 'Chicken 6oz', grams: 50 },
  { label: 'Steak 6oz', grams: 45 },
  { label: 'Greek yogurt', grams: 20 },
  { label: '3 eggs', grams: 18 },
  { label: 'Shake + milk', grams: 33 },
];

const onDate = (rows, date) => (rows || []).filter((r) => r?.date === date);

/** Total grams of protein logged on a date. */
function proteinOnDate(entries, date) {
  return onDate(entries, date).reduce((sum, e) => sum + (Number(e.grams) || 0), 0);
}

/** One total per day, oldest first — the shape the charts want. */
function proteinDailyTotals(entries) {
  const byDate = {};
  for (const e of entries || []) {
    if (!e?.date) continue;
    byDate[e.date] = (byDate[e.date] || 0) + (Number(e.grams) || 0);
  }
  return Object.entries(byDate)
    .map(([date, value]) => ({ date, value }))
    .sort((a, b) => a.date.localeCompare(b.date));
}

/** Every ISO date in the `days`-long window ending on `todayIso`, oldest first. */
function windowDates(todayIso, days) {
  const [y, m, d] = todayIso.split('-').map(Number);
  const out = [];
  for (let i = days - 1; i >= 0; i--) {
    const dt = new Date(Date.UTC(y, m - 1, d - i));
    out.push(dt.toISOString().slice(0, 10));
  }
  return out;
}

/**
 * Protein performance over a window.
 * Only days at or before today count, so a fresh window does not read as
 * missed days you have not lived through yet.
 */
function proteinAdherence(entries, target, todayIso, days = 7) {
  const dates = windowDates(todayIso, days);
  const totals = dates.map((date) => proteinOnDate(entries, date));
  const logged = totals.filter((t) => t > 0);
  const daysHit = target > 0 ? totals.filter((t) => t >= target).length : 0;
  const average = logged.length ? Math.round(totals.reduce((a, b) => a + b, 0) / dates.length) : 0;
  return { dates, totals, average, daysHit, days: dates.length, loggedDays: logged.length };
}

/** Grams of creatine recorded for a date, 0 if none. */
function creatineOnDate(log, date) {
  const hit = onDate(log, date)[0];
  return hit ? Number(hit.grams) || 0 : 0;
}

/**
 * Consecutive days ending today on which creatine was taken.
 * Today not being logged yet does not break the streak — it just has not
 * happened. Yesterday missing does.
 */
function creatineStreak(log, todayIso) {
  const taken = new Set((log || []).filter((r) => Number(r?.grams) > 0).map((r) => r.date));
  const [y, m, d] = todayIso.split('-').map(Number);
  let streak = 0;
  for (let i = 0; i < 3650; i++) {
    const date = new Date(Date.UTC(y, m - 1, d - i)).toISOString().slice(0, 10);
    if (taken.has(date)) streak += 1;
    else if (i === 0) continue; // today is still open
    else break;
  }
  return streak;
}

/** How many of the last `days` days carried a dose. */
function creatineAdherence(log, todayIso, days = 30) {
  const dates = windowDates(todayIso, days);
  const taken = dates.filter((date) => creatineOnDate(log, date) > 0).length;
  return { taken, of: dates.length, pct: Math.round((taken / dates.length) * 100) };
}

/** Plain-language read on the last week of protein. */
function proteinVerdict({ average, target, loggedDays, days }) {
  if (!loggedDays) return { status: 'none', message: 'Nothing logged yet this week.' };
  if (!target) return { status: 'none', message: `Averaging ${average} g/day.` };
  const pct = Math.round((average / target) * 100);
  if (pct >= 95) return { status: 'ok', message: `Averaging ${average} g/day — on target.` };
  if (pct >= 80) {
    return { status: 'warn', message: `Averaging ${average} g/day — ${target - average} g short of ${target}.` };
  }
  return {
    status: 'low',
    message: `Averaging ${average} g/day against ${target}. That gap is enough to cost you muscle on a bulk.`,
  };
}

// ---------- src/ui/dom.js ----------
// Tiny DOM helpers + a dependency-free line chart.

const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => [...root.querySelectorAll(sel)];

function el(tag, attrs = {}, children = []) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v === null || v === undefined || v === false) continue;
    if (k === 'class') node.className = v;
    else if (k === 'html') node.innerHTML = v;
    else if (k === 'text') node.textContent = v;
    else if (k.startsWith('on') && typeof v === 'function') node.addEventListener(k.slice(2).toLowerCase(), v);
    else if (k === 'dataset') Object.assign(node.dataset, v);
    else node.setAttribute(k, v === true ? '' : String(v));
  }
  for (const c of [].concat(children)) {
    if (c === null || c === undefined || c === false) continue;
    node.append(c.nodeType ? c : document.createTextNode(String(c)));
  }
  return node;
}

const esc = (s) =>
  String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function fmtDate(iso) {
  if (!iso) return '';
  const [y, m, d] = iso.split('-').map(Number);
  const dt = new Date(y, m - 1, d);
  return dt.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
}

function fmtDateLong(iso) {
  if (!iso) return '';
  const [y, m, d] = iso.split('-').map(Number);
  return new Date(y, m - 1, d).toLocaleDateString(undefined, {
    weekday: 'short',
    month: 'short',
    day: 'numeric',
    year: 'numeric',
  });
}

const mmss = (secs) => {
  const s = Math.max(0, Math.round(secs));
  return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
};

/**
 * Line chart as inline SVG. Returns an <svg> element.
 * @param {{date:string, value:number}[]} points
 */
function lineChart(points, { height = 150, unit = '' } = {}) {
  const NS = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(NS, 'svg');
  svg.setAttribute('class', 'chart');
  svg.setAttribute('viewBox', `0 0 300 ${height}`);
  svg.setAttribute('preserveAspectRatio', 'none');
  svg.setAttribute('role', 'img');

  const pts = (points || []).filter((p) => Number.isFinite(p.value));
  if (!pts.length) return svg;

  const padL = 34;
  const padR = 8;
  const padT = 12;
  const padB = 20;
  const w = 300 - padL - padR;
  const h = height - padT - padB;

  const values = pts.map((p) => p.value);
  let lo = Math.min(...values);
  let hi = Math.max(...values);
  if (hi === lo) {
    hi = lo + Math.max(1, Math.abs(lo) * 0.02);
    lo -= Math.max(1, Math.abs(lo) * 0.02);
  }
  const pad = (hi - lo) * 0.12;
  lo -= pad;
  hi += pad;

  const x = (i) => padL + (pts.length === 1 ? w / 2 : (i / (pts.length - 1)) * w);
  const y = (v) => padT + h - ((v - lo) / (hi - lo)) * h;

  const mk = (tag, attrs) => {
    const n = document.createElementNS(NS, tag);
    for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, String(v));
    return n;
  };

  for (const frac of [0, 0.5, 1]) {
    const yy = padT + h * frac;
    svg.append(mk('line', { class: 'grid-line', x1: padL, x2: padL + w, y1: yy, y2: yy }));
    const v = hi - (hi - lo) * frac;
    const t = mk('text', { class: 'lbl', x: 0, y: yy + 3.5 });
    t.textContent = v >= 100 ? Math.round(v) : Math.round(v * 10) / 10;
    svg.append(t);
  }

  const d = pts.map((p, i) => `${i ? 'L' : 'M'}${x(i).toFixed(2)},${y(p.value).toFixed(2)}`).join(' ');
  svg.append(mk('path', { class: 'line', d, 'vector-effect': 'non-scaling-stroke' }));
  pts.forEach((p, i) => svg.append(mk('circle', { class: 'dot', cx: x(i), cy: y(p.value), r: 3 })));

  const first = mk('text', { class: 'lbl', x: padL, y: height - 5 });
  first.textContent = fmtDate(pts[0].date);
  svg.append(first);
  if (pts.length > 1) {
    const last = mk('text', { class: 'lbl', x: padL + w, y: height - 5, 'text-anchor': 'end' });
    last.textContent = fmtDate(pts[pts.length - 1].date);
    svg.append(last);
  }

  svg.setAttribute(
    'aria-label',
    `${pts.length} points from ${pts[0].value}${unit} to ${pts[pts.length - 1].value}${unit}`
  );
  return svg;
}

const store = new Store(safeBackend(window.localStorage));

// Anything that escapes a handler used to vanish into the console, where a
// phone user can never see it. Keep the last few so Diagnostics can show them.
const faults = [];
const recordFault = (what, err) => {
  faults.unshift({ at: new Date().toISOString(), what, message: String(err?.message || err) });
  faults.length = Math.min(faults.length, 5);
};
window.addEventListener('error', (e) => recordFault('error', e.error || e.message));
window.addEventListener('unhandledrejection', (e) => recordFault('promise', e.reason));

// Expose for end-to-end tests to seed and inspect state.
window.__zolf = { store, render: () => render(), faults };

// ---------------------------------------------------------------- rest timer
const rest = { endsAt: 0, tick: null };

function startRest(seconds) {
  rest.endsAt = Date.now() + seconds * 1000;
  $('#rest-bar').hidden = false;
  if (!rest.tick) rest.tick = setInterval(paintRest, 250);
  paintRest();
}

function stopRest() {
  rest.endsAt = 0;
  clearInterval(rest.tick);
  rest.tick = null;
  $('#rest-bar').hidden = true;
}

function paintRest() {
  const left = (rest.endsAt - Date.now()) / 1000;
  $('#rest-time').textContent = mmss(left);
  if (left <= 0) {
    $('#rest-label').textContent = 'Go';
    if (navigator.vibrate) navigator.vibrate([120, 60, 120]);
    stopRest();
    toast('Rest done — next set.');
  } else {
    $('#rest-label').textContent = 'Rest';
  }
}

let toastTimer;
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => {
    t.hidden = true;
  }, 2600);
}

/** "90 sec" / "2 min" / "2:30" — how a rest reads on a sheet. */
function restLabel(seconds) {
  if (!seconds) return '—';
  if (seconds < 60) return `${seconds} sec`;
  const m = Math.floor(seconds / 60);
  const rem = seconds % 60;
  return rem ? `${m}:${String(rem).padStart(2, '0')} min` : `${m} min`;
}

      onclick: () => {
        const cur = store.state.active.entries.find((e) => e.exerciseId === entry.exerciseId).sets[i];
        const nextDone = !cur.done;
        const patch = { done: nextDone };
        // Filling in the suggestion on tap is what makes this fast at the rack.
        if (nextDone) {
          if (cur.weight === '' && tip.weight != null) patch.weight = tip.weight;
          if (cur.reps === '') patch.reps = tip.reps;
        }
        store.setSet(entry.exerciseId, i, patch);
        if (nextDone) startRest(exercise.rest || store.state.settings.restSeconds);
        render();
      },
    });
    const kill = el('button', {
      class: 'kill',
      type: 'button',
      'data-field': 'remove',
      'aria-label': `Remove set ${i + 1}`,
      text: '×',
      onclick: () => {
        store.removeSet(entry.exerciseId, i);
        render();
      },
    });

    row.append(weight, reps, rpe, tick, kill);
    body.append(row);
  });

  body.append(
    el('button', {
      class: 'btn sm ghost',
      type: 'button',
      'data-action': 'add-set',
      text: '+ Add set',
      onclick: () => {
        store.addSet(entry.exerciseId);
        render();
      },
    })
  );

  const pr = exercisePR(store.state.sessions, entry.exerciseId);
  if (pr) {
    body.append(
      el('div', {
        class: 'small muted mt',
        text: `PR: ${pr.weight} lb × ${pr.reps} (${pr.e1rm} lb est. 1RM, ${fmtDate(pr.date)})`,
      })
    );
  }
  return body;
}

function finishWorkout() {
  const active = store.state.active;
  if (!active) return;
  const prs = active.entries
    .filter((e) => e.sets.some((s) => s.done && Number(s.reps) > 0))
    .filter((e) => isNewPR(store.state.sessions, active, e.exerciseId));
  const done = store.finishSession();
  stopRest();
  ui.openExercise = null;
  render();
  if (!done) toast('Nothing logged — session discarded.');
  else if (prs.length) toast(`Done. ${prs.length} new PR${prs.length > 1 ? 's' : ''}: ${prs.map((p) => p.name).join(', ')}`);
  else toast(`Done. ${sessionHardSets(done)} sets, ${sessionVolume(done).toLocaleString()} lb moved.`);
}

// --------------------------------------------------------------- calendar
function viewCalendar() {
  const todayIso = today();
  if (!ui.cal) {
    const { y, m } = parseIso(todayIso);
    ui.cal = { y, m };
  }
  const { y, m } = ui.cal;
  const sessions = store.state.sessions;
  const weeks = monthDays(sessions, y, m, todayIso);
  const summary = monthSummary(sessions, y, m, todayIso);
  const lastWeek = sessionsInLastDays(sessions, todayIso, 7);
  const since = daysSinceLastSession(sessions, todayIso);

  const wrap = el('div');
  const card = el('div', { class: 'card', 'data-calendar': '1' });

  const step = (delta) => () => {
    ui.cal = shiftMonth(y, m, delta);
    render();
  };
  card.append(
    el('div', { class: 'cal-head' }, [
      el('button', { class: 'cal-nav', type: 'button', 'data-cal': 'prev', 'aria-label': 'Previous month', text: '‹', onclick: step(-1) }),
      el('div', { class: 'cal-title', 'data-cal-title': '1', text: `${MONTH_NAMES[m]} ${y}` }),
      el('button', { class: 'cal-nav', type: 'button', 'data-cal': 'next', 'aria-label': 'Next month', text: '›', onclick: step(1) }),
    ])
  );

  const grid = el('div', { class: 'cal-grid' });
  DAY_INITIALS.forEach((d, i) => grid.append(el('div', { class: 'cal-dow', text: d, key: i })));
  for (const week of weeks) {
    for (const day of week) {
      if (!day) {
        grid.append(el('div', { class: 'cal-day empty', 'aria-hidden': 'true' }));
        continue;
      }
      const openHere = store.state.active?.date === day.date;
      const classes = ['cal-day'];
      if (day.trained) classes.push('trained');
      else if (openHere) classes.push('pending');
      else if (day.isFuture) classes.push('future');
      else classes.push('rest');
      if (day.isToday) classes.push('today');

      const state = day.trained
        ? day.label
        : openHere
          ? 'workout open — not finished yet'
          : day.isFuture
            ? 'upcoming'
            : 'rest day';
      if (day.date === ui.calSelected) classes.push('selected');
      grid.append(
        el('button', {
          type: 'button',
          class: classes.join(' '),
          'data-day-cell': day.date,
          'data-trained': String(day.trained),
          title: `${day.date} — ${state}`,
          'aria-label': `${day.date}, ${state}`,
          'aria-pressed': String(day.date === ui.calSelected),
          text: String(day.day),
          onclick: () => {
            ui.calSelected = ui.calSelected === day.date ? null : day.date;
            render();
          },
        })
      );
    }
  }
  card.append(grid);

  card.append(
    el('div', { class: 'cal-legend' }, [
      el('span', {}, [el('i', { class: 'trained' }), 'Trained']),
      el('span', {}, [el('i', { class: 'rest' }), 'Rest']),
      store.state.active ? el('span', {}, [el('i', { class: 'pending' }), 'Open']) : null,
      el('span', {}, [el('i', { class: 'today' }), 'Today']),
    ])
  );
  wrap.append(card);

  wrap.append(
    el('div', { class: 'grid three', 'data-cal-stats': '1' }, [
      statCard('This month', summary.sessionCount),
      statCard('Last 7 days', `${lastWeek}/4`),
      statCard('Days since', since == null ? '–' : since),
    ])
  );

  if (ui.calSelected) wrap.append(dayDetail(ui.calSelected));
  return wrap;
}

/**
 * Everything logged on one date: each exercise, each set as it was entered,
 * with the estimated 1RM of the best set so progression is readable at a
 * glance rather than reconstructed from memory.
 */
function dayDetail(date) {
  const sessions = store.state.sessions.filter((s) => s.date === date);
  const panel = el('div', { class: 'card day-detail', 'data-day-detail': date });

  panel.append(
    el('div', { class: 'spread' }, [
      el('div', {}, [
        el('span', { class: 'eyebrow', text: 'Session detail' }),
        el('div', { class: 'day-detail-date', text: fmtDateLong(date) }),
      ]),
      el('button', {
        class: 'btn sm ghost',
        type: 'button',
        'data-action': 'close-day',
        text: 'Close',
        onclick: () => {
          ui.calSelected = null;
          render();
        },
      }),
    ])
  );

  if (!sessions.length) {
    panel.append(
      el('p', { class: 'small muted mt', 'data-day-empty': '1', text: 'Rest day — nothing logged.' })
    );
    return panel;
  }

  for (const session of sessions) {
    panel.append(
      el('div', { class: 'day-detail-session', 'data-detail-session': session.id }, [
        el('div', { class: 'spread mt' }, [
          el('h3', { text: session.dayName || session.dayId }),
          el('span', {
            class: 'small muted mono',
            text: `${sessionHardSets(session)} sets · ${sessionVolume(session).toLocaleString()} lb`,
          }),
        ]),
      ])
    );

    for (const entry of session.entries) {
      const best = bestSet(entry);
      const block = el('div', { class: 'detail-ex', 'data-detail-ex': entry.exerciseId });
      block.append(
        el('div', { class: 'spread' }, [
          el('strong', { class: 'detail-ex-name', text: entry.name }),
          best ? el('span', { class: 'pill ok', text: `${best.e1rm} lb 1RM` }) : null,
        ])
      );
      const rows = el('div', { class: 'detail-sets' });
      entry.sets.forEach((set, i) => {
        rows.append(
          el('span', { class: 'detail-set', 'data-detail-set': i }, [
            el('span', { class: 'detail-set-n', text: `${i + 1}` }),
            `${set.weight === '' || set.weight == null ? 'BW' : set.weight} × ${set.reps}`,
            set.rpe ? el('span', { class: 'detail-set-rpe', text: ` @${set.rpe}` }) : null,
          ])
        );
      });
      block.append(rows);
      panel.append(block);
    }

    if (session.note) panel.append(el('p', { class: 'small muted mt', text: `“${session.note}”` }));
  }
  return panel;
}

    for (const entry of s.entries) {

      tbody.append(

          el('td', { text: entry.name }),
