<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#142C26" />
<title>ZOLF Lift</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;800&family=JetBrains+Mono:wght@600;700&display=swap" />
<link rel="manifest" href="./public/manifest.webmanifest" />
<link rel="icon" href="./public/icon.svg" />
<link rel="apple-touch-icon" href="./public/icon.svg" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<!-- Palette first: the profile's tokens, then the structure that uses them.
     The published bundle inlines the same pair. -->
<link rel="stylesheet" href="./src/ui/tokens-zolf.css" />
<link rel="stylesheet" href="./src/ui/styles.css" />
</head>
<body>
<div id="app" class="app">
  <header class="topbar">
    <div class="brand">ZOLF<span>LIFT</span></div>
    <div id="topbar-right" class="topbar-right"></div>
  </header>

  <main id="view" class="view" aria-live="polite"></main>

  <div id="finish-bar" class="finish-bar" hidden>
    <div class="finish-progress">
      <span id="finish-count" class="finish-count">0/0 sets</span>
      <span id="finish-day" class="finish-day"></span>
    </div>
    <button id="finish-now" class="btn primary" type="button" data-action="finish-sticky">Finish workout</button>
  </div>

  <div id="rest-bar" class="rest-bar" hidden>
    <span id="rest-label" class="rest-label">Rest</span>
    <strong id="rest-time" class="rest-time">2:30</strong>
    <button id="rest-add" class="chip" type="button">+30s</button>
    <button id="rest-skip" class="chip" type="button">Skip</button>
  </div>

  <nav class="tabbar" role="tablist">
    <button class="tab" data-tab="today" role="tab">Today</button>
    <button class="tab" data-tab="history" role="tab">Log</button>
    <button class="tab" data-tab="progress" role="tab">Trials</button>
    <button class="tab" data-tab="body" role="tab">Temple</button>
    <button class="tab" data-tab="settings" role="tab">Forge</button>
  </nav>
</div>

<div id="toast" class="toast" hidden></div>

<script type="module" src="./src/ui/app.js"></script>
</body>
</html>
